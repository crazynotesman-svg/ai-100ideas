# Daily ingestion + enrichment pipeline for ai.100ideas.net
#
# Runs every day at 02:00 UTC and can be triggered manually.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEEPSEEK_API_KEY        DeepSeek API key
#   CLOUDFLARE_API_TOKEN    Cloudflare API token with D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
#   CLOUDFLARE_D1_DATABASE_ID  The D1 database id (from `wrangler d1 create`)
#
# GITHUB_TOKEN is provided automatically by GitHub Actions (no secret needed);
# it only raises the Search API rate limit. Increase it via a PAT if you hit
# secondary-rate-limit errors.
name: Daily Sync (GitHub → DeepSeek → D1)

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

# Don't let overlapping runs clobber each other; queue instead.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment + D1 sync pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          SYNC_METHOD: ${{ secrets.SYNC_METHOD || 'rest' }}
        run: npx tsx scripts/run-pipeline.ts
