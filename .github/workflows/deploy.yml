# Build + deploy ai.100ideas.net to Cloudflare Workers (with Assets).
#
# This project is a Cloudflare WORKER, not Pages. `astro build` emits
# `dist/server/entry.mjs` (the Worker) + `dist/client/` (static assets), driven
# by the generated `dist/server/wrangler.json`. We deploy with `wrangler deploy`.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN      CF token with Workers:Edit + D1:Edit
#   CLOUDFLARE_ACCOUNT_ID     Cloudflare account id
#
# After the Worker is live, connect the custom domain `ai.100ideas.net` once in
# Workers -> ai-100ideas -> Settings -> Domains & Routes (see DEPLOY.md §2.3).
name: Deploy (Astro → Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply D1 migrations (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote

      - name: Deploy to Cloudflare Workers
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The D1 migrate step (run from the repo root) writes a
          # .wrangler/deploy config cache at the repo root. Its base path differs
          # from this deployment's config (dist/server/wrangler.json), which
          # makes `wrangler deploy` abort with "do not share the same base
          # path". Drop the stale cache so deploy regenerates it from the
          # correct config.
          rm -rf "${{ github.workspace }}/.wrangler" .wrangler
          npx wrangler deploy
